<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adventure Game</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="battleScreen" class="battle-screen" hidden>
    <div class="impact-flash" id="impactFlash"></div>
    <div class="vs-intro" id="vsIntro" hidden>VS</div>

    <div class="battle-hud">
      <div class="hud-card hud-player">
        <div class="hud-name"><span id="hudPlayerIcon">🥷</span> <span id="hudPlayerName">-</span></div>
        <div class="bar big"><div id="hudPlayerBar" class="bar-fill health"></div></div>
        <div class="hud-sub" id="hudPlayerSub">-</div>
      </div>
      <div class="hud-vs">⚔️</div>
      <div class="hud-card hud-enemy">
        <div class="hud-name"><span id="hudEnemyName">-</span> <span id="hudEnemyIcon">❔</span></div>
        <div class="bar big"><div id="hudEnemyBar" class="bar-fill enemy"></div></div>
        <div class="hud-sub" id="hudEnemySub">-</div>
      </div>
    </div>

    <div class="battle-stage">
      <div id="battlePlayer" class="battle-combatant combatant player-side">
        <div class="sprite big" id="battlePlayerSprite">🥷</div>
        <div class="battle-shadow"></div>
      </div>
      <div id="battleEnemy" class="battle-combatant combatant enemy-side">
        <div class="sprite big" id="battleEnemySprite">❔</div>
        <div class="battle-shadow"></div>
      </div>
    </div>

    <div class="battle-log" id="battleLog"></div>

    <div class="battle-actions" id="battleActions"></div>
  </div>

  <div class="app">
    <header class="app-header">
      <div class="title-block">
        <h1>🗡️ Adventure Game</h1>
        <span id="sceneBadge" class="scene-badge">📍 Intro</span>
      </div>
      <div class="header-actions">
        <button id="muteBtn" class="ghost-btn icon-btn" title="Toggle sound" aria-label="Toggle sound">🔊</button>
        <button id="restartBtn" class="ghost-btn" hidden>Play Again</button>
      </div>
    </header>

    <main class="layout">
      <section class="log-panel" id="logPanel">
        <div id="log" class="log" aria-live="polite"></div>

        <div id="textInputRow" class="input-row" hidden>
          <input id="nameInput" type="text" placeholder="Type your name…" maxlength="24" autocomplete="off">
          <button id="nameSubmit">Enter</button>
        </div>

        <div id="options" class="options" hidden></div>
      </section>

      <aside class="sidebar">
        <div id="playerCard" class="card" hidden>
          <h2><span class="card-icon">🧑‍🎤</span> Player</h2>
          <div class="stat-row"><span>🏷️ Name</span><strong id="pName">-</strong></div>
          <div class="stat-row"><span>🎭 Class</span><strong id="pClass">-</strong></div>
          <div class="stat-row"><span>❤️ Health</span><strong id="pHealth">-</strong></div>
          <div class="bar"><div id="pHealthBar" class="bar-fill health"></div></div>
          <div class="stat-row"><span>⚔️ Damage</span><strong id="pDamage">-</strong></div>
          <div class="stat-row"><span>💰 Money</span><strong id="pMoney">-</strong></div>
          <div class="stat-row"><span>🔫 Weapon</span><strong id="pWeapon">-</strong></div>
          <div class="stat-row"><span>🛡️ Armor</span><strong id="pArmor">-</strong></div>
          <div class="inventory">
            <span id="invFood" class="chip">🍖 Food</span>
            <span id="invWater" class="chip">💧 Water</span>
            <span id="invFirewood" class="chip">🪵 Firewood</span>
          </div>
        </div>

        <div id="enemyCard" class="card enemy-card" hidden>
          <h2 id="eName">Enemy</h2>
          <div class="stat-row"><span>❤️ Health</span><strong id="eHealth">-</strong></div>
          <div class="bar"><div id="eHealthBar" class="bar-fill enemy"></div></div>
          <div class="stat-row"><span>⚔️ Damage</span><strong id="eDamage">-</strong></div>
          <div class="stat-row"><span>📊 Progress</span><strong id="eProgress">-</strong></div>
        </div>
      </aside>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
